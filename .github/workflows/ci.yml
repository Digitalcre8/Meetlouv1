name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration-immutability guard diffs against the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
        run: pnpm --filter @meetlou/web build
      - name: Repo guards
        env:
          GUARD_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: pnpm guards

  # Brings up throwaway Postgres + GoTrue + PostgREST (the images `supabase start` uses),
  # applies every migration, seeds, and runs the auth / RLS / append-only suite.
  # No hosted credentials involved.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the edge functions
        run: pnpm deno:check
      - run: pnpm db:up
      - name: Seed runs cleanly on a fresh database
        run: pnpm seed
      # Also serves the edge functions under Deno (docker) and replays the fixtures at them.
      - run: pnpm db:test
